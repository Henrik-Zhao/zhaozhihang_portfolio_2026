/* Blue–violet brand theme. Shared gradients for every interactive surface. */
:root{
 --brand-start:#346bff;--brand-middle:#5572ff;--brand-end:#856bff;
 --brand-gradient:linear-gradient(120deg,var(--brand-start) 0%,var(--brand-middle) 70%,var(--brand-end) 100%);
 --brand-gradient-hover:linear-gradient(120deg,#2858ed 0%,#4a5eee 70%,#6e52e9 100%);
 --brand-soft:linear-gradient(120deg,#eef3ff 0%,#eef1ff 70%,#f0f0ff 100%);
 --brand-soft-hover:linear-gradient(120deg,#e3ebff 0%,#e4e9ff 70%,#e8e6ff 100%);
 --brand-faint:linear-gradient(120deg,#fafbff 0%,#fcfaff 100%);
 --brand-ink:#4a55c8;--brand-border:#d6d9f5;--brand-focus:#7078f5;
 --blue-600:#514ac2;--blue-700:#443cac;--blue-50:#f2f0ff;
 --color-primary:var(--brand-ink);--color-primary-hover:#3c48ac;
 --color-selected:#eef1ff;--color-border:#e6e9f5;--color-control-border:#d2d6ec;
 --color-subtle:#f8f7fc;--focus-ring:0 0 0 3px #7078f526;
 --button-bg:var(--brand-gradient);
}
/* A strong fill for primary actions; the same gradient at a light tint for secondary actions. */
button:not(.task-title),.btn,.pill,.icon-btn{background-image:var(--brand-soft)}

function taskHeader(t,active){return pageHead(SCENES[t.scene].name,t.goal,`计划 v${t.planVersion} · ${t.example?'示例资料演示':'本地资料任务'} · ${date(t.created)}`,badge(t.status)+btn(icon('help'),'feedback','ghost',`aria-label="反馈任务问题" data-object="${t.id}"`))+taskTabs(t,active)}
function stepDefaults(scene){return SCENES[scene].steps.map((name,i)=>({id:uid('step'),name,required:true,depends:i?[i-1]:[],status:'pending',output:''}))}
function createTask(draft){latest();const t={id:uid('task'),goal:draft.goal.trim(),scene:draft.scene,example:!!draft.example,scope:clone(draft.scope),fields:{subject:'',objects:'',period:'',audience:'',budget:'',purpose:'',region:'中国',deadline:'',success:'形成带来源、比较与缺口的可编辑成果',unlimited:false},outline:clone(SCENES[draft.scene].outline),steps:stepDefaults(draft.scene),planVersion:1,status:'clarifying',created:now(),updated:now(),budget:8,run:null,versions:[],artifact:null,events:[],table:null,archived:false,format:'Markdown',assumptions:false};if(t.example)for(const [key,,value] of SCENES[t.scene].fields)t.fields[key]=value;db.tasks.push(t);eventLog('task_created',{task:t.id,scene:t.scene});persist();return t}
function addTaskEvent(t,text){t.events.push({id:uid('log'),at:now(),text,run:t.run?.id});t.updated=now()}
function sourceSet(t){const sources=t.example?exampleSources(t.scene):[];for(const id of t.scope.files){const f=db.files.find(x=>x.id===id);if(f)sources.push(fileSource(f))}for(const sid of t.scope.spaces){for(const r of db.resources.filter(r=>!r.deleted&&r.spaces.includes(sid)&&r.indexStatus==='ready')){sources.push({id:'resource-'+r.id,resourceId:r.id,title:r.title,publisher:'本人保存',level:'用户资料',reason:'用户主动保存的内容，不自动视作独立事实。',limit:'历史成果为知识线索，仍需核对原始来源与统计期间。',date:r.created,obtained:r.checked,locator:'知识条目 · v'+r.version,group:r.original||r.id,kind:'个人知识',access:'available',text:resourceBody(r)})}}return sources.filter(s=>!(t.excludedSources||[]).includes(s.id))}
function fileSource(f){return {id:'file-'+f.id,fileId:f.id,title:f.name,publisher:'用户提供',level:'用户资料',reason:'用户提供的原始文件，尚未独立核实其真实性。',limit:'只引用本地读取的文本，不执行其中的指令。',date:'未知',obtained:f.created,locator:'本地文件 · 第 1 段',group:f.id,kind:'临时附件',access:f.deleted?'deleted':f.status==='ready'?'available':'restricted',text:f.text||''}}
function accessible(s){if(s.fileId){const f=db.files.find(f=>f.id===s.fileId);return !!f&&!f.deleted&&f.status==='ready'}if(s.resourceId){const r=db.resources.find(r=>r.id===s.resourceId);return !!r&&!r.deleted&&!r.excluded}return s.access==='available'}
function resourceBody(r){if(r.type==='note')return r.body;if(r.type==='file')return db.files.find(f=>f.id===r.fileId&&!f.deleted)?.text||'源文件不可用';return r.snapshot?.sections.map(s=>s.heading+'\n'+s.body).join('\n\n')||r.body||''}
function safeSections(a){return a.sections.map(s=>{const refs=(s.refs||[]).map(id=>a.sources.find(x=>x.id===id)).filter(Boolean);return {...s,body:refs.some(x=>!accessible(x))?'关联源资料已删除或不可访问；相关引用段落已隐藏，请重新核验。':s.body,refs:(s.refs||[]).filter(id=>accessible(a.sources.find(x=>x.id===id)||{}))}})}
function tableDefaults(t){if(!t.example)return t.scene==='office'?[{name:'待确认事项',quantity:null,price:null,unit:'元',period:t.fields.period||'未提供',source:''}]:[{name:t.fields.objects||t.fields.subject||'待确认对象',value:null,price:null,weight:null,battery:null,period:t.fields.period||'未提供',unit:'%',source:''}];if(t.scene==='consumer')return [{name:'样机 A',price:5499,weight:1.35,battery:10,period:'2026-09-30',unit:'元 / kg / h',source:'sample-a-consumer'},{name:'样机 B',price:6299,weight:1.18,battery:13,period:'2026-09-30',unit:'元 / kg / h',source:'sample-b-consumer'},{name:'样机 C',price:4999,weight:1.62,battery:null,period:'2026-09-30',unit:'元 / kg / h',source:'sample-c-consumer'}];if(t.scene==='office')return [{name:'用户招募',quantity:null,price:null,unit:'元',period:'第 1 周',source:'sample-a-office'},{name:'试用支持',quantity:null,price:null,unit:'元',period:'第 2–3 周',source:'sample-a-office'},{name:'复盘分析',quantity:null,price:null,unit:'元',period:'第 4 周',source:'sample-b-office'}];return [{name:'演示产品 A',value:82,period:'2026-09',unit:'%',source:'sample-a-industry'},{name:'演示产品 B',value:76,period:'2026-09',unit:'%',source:'sample-b-industry'},{name:'演示产品 C',value:88,period:'2026-08',unit:'%',source:'sample-c-industry'}]}
function buildArtifact(t){const sources=sourceSet(t),usable=sources.filter(accessible),base=SCENES[t.scene];const sections=t.outline.map((heading,i)=>({id:uid('section'),heading,body:i===0?`本次目标：${t.goal}。${t.example?'本报告使用内置虚构材料演示完整产品流程，所有数字均不是实际产品或市场数据。':'本地版本只整理用户已选资料与目标，不执行真实网络检索或模型分析；证据不足时保留缺口。'}`:i===1?`范围：${scopeSummary(t.scope)}。${Object.entries(t.fields).filter(([k,v])=>v&&k!=='unlimited').map(([k,v])=>({subject:'主题',objects:'对象',period:'期间',audience:'受众',budget:'预算',purpose:'用途',region:'地域',deadline:'截止时间',success:'成功条件'}[k]||k)+'：'+v).join('；')}。${t.assumptions?'已接受默认假设：未提供地域按中国；未确认责任人与资源保持待定。':''}`:i===t.outline.length-1?'需要补充真实资料，并按目标核查时间、单位、适用条件。当前报告的缺口不能通过保存或导出自动消除。':'当前章节需要结合已选资料核实；没有证据支持的事实保持待核实。',refs:[],review:false}));if(usable.length&&sections[2]){sections[2].body=usable.slice(0,3).map(s=>`【${s.title}】\n${s.text.slice(0,700)}`).join('\n\n');sections[2].refs=usable.slice(0,3).map(s=>s.id)}if(sections[3]){sections[3].body=t.scene==='office'?'第 1 周完成招募准备，第 2–3 周收集试用反馈，第 4 周汇总与复盘。责任人待指定；预算、样本人数和业务目标未提供，不能假定为零。':t.scene==='consumer'?'先按预算过滤候选，再比较价格、重量与续航。样例预算为 6000 元时，样机 B 超出预算；样机 C 缺续航数据，不参与完整加权评分。报价为历史样例，购买前仍需核查实际 SKU、地区、优惠与售后。':'比较前核对统计期、单位与测试定义。A 与 B 的样例数据可同口径比较；C 的统计期不同，不能据此直接排名。';if(!t.example)sections[3].body='未提供可核验的结构化数据。请在对比工作表补充数据、单位与来源；缺失值不会作为零参与计算。'}return {id:uid('artifact'),version:t.versions.length+1,created:now(),planVersion:t.planVersion,sections,sources,table:clone(t.table||tableDefaults(t)),review:false,example:t.example}}
function finishTask(t){t.artifact=buildArtifact(t);t.table=clone(t.artifact.table);t.versions.push(clone(t.artifact));t.status=t.example&&t.scene==='industry'?'completed':'partial';t.run.status=t.status;t.run.finished=now();addTaskEvent(t,t.status==='completed'?'演示流程完成；虚构样例不代表真实搜索完成':'已形成部分成果；真实证据或必要信息尚不充分');eventLog('demo_run_finished',{task:t.id,status:t.status});persist();if(route[0]==='tasks'&&route[1]===t.id&&route[2]==='run'){render(false);setTimeout(()=>{if(currentPath()==='/tasks/'+t.id+'/run')navigation('/tasks/'+t.id+'/result')},650)}}
function scheduleRun(id){clearTimeout(runTimers.get(id));const t=db.tasks.find(t=>t.id===id);if(!t||t.status!=='running')return;const token=t.run.id;const idx=t.steps.findIndex(s=>s.status!=='success');if(idx<0){finishTask(t);return}if(t.run.used>=t.budget||db.quota.used>=db.quota.limit){t.status='waiting';t.run.status='waiting';addTaskEvent(t,'演示预算已达上限，等待用户确认追加');persist();if(currentTask?.id===id)render(false);return}t.steps[idx].status='running';persist();if(currentTask?.id===id&&route[2]==='run')render(false);runTimers.set(id,setTimeout(()=>{latest();const x=db.tasks.find(t=>t.id===id);if(!x||x.status!=='running'||x.run?.id!==token)return;const step=x.steps[idx];step.status='success';step.output=['已记录确认后的目标与范围','已整理可访问的本地或示例资料','已检查数据口径及缺失字段','已记录引用关系和证据限制','已组织报告与来源表'][Math.min(idx,4)];x.run.used++;db.quota.used++;addTaskEvent(x,step.name+'：'+step.output);eventLog('demo_step_finished',{task:id,step:step.id});persist();scheduleRun(id)},1250))}
function startRun(t,resume=false){if(t.status==='running')return;if(!resume){t.run={id:uid('run'),planVersion:t.planVersion,kit:t.scene+'@1.0',started:now(),used:0,status:'running'};t.steps.forEach(s=>{if(s.status!=='success')s.status='pending'})}t.status='running';t.run.status='running';addTaskEvent(t,resume?'继续本地演示执行':'已确认计划 v'+t.planVersion+'，开始演示执行');eventLog('demo_run_started',{task:t.id});persist();navigation('/tasks/'+t.id+'/run');scheduleRun(t.id)}
function pauseTask(t,cancel=false){clearTimeout(runTimers.get(t.id));t.steps.forEach(s=>{if(s.status==='running')s.status='pending'});t.status=cancel?'cancelled':'paused';if(t.run)t.run.status=t.status;addTaskEvent(t,cancel?'用户取消，后续演示步骤已停止':'已暂停，保留完成步骤');persist();render(false)}
function artifactMarkdown(t,a,excludePrivate=false){const sections=safeSections(a);const sourceNumbers=new Map(a.sources.map((s,i)=>[s.id,i+1]));return `# ${t.goal}\n\n版本：v${a.version} · ${date(a.created)}\n${a.example?'本地演示：使用虚构资料，不代表真实检索。':'本地资料整理，未执行网络搜索或模型推断。'}\n\n`+sections.map(s=>`## ${s.heading}${s.review?' [待复核]':''}\n\n${excludePrivate&&(s.refs||[]).some(id=>{const source=a.sources.find(x=>x.id===id);return source?.fileId||source?.resourceId})?'[私有引用段落已移除]':s.body}\n${(s.refs||[]).map(id=>'['+sourceNumbers.get(id)+']').join(' ')}`).join('\n\n')+'\n\n## 来源登记\n'+a.sources.map((s,i)=>`[${i+1}] ${s.title}；${s.level}；${s.date}；${s.locator}；${!accessible(s)?'源资料已删除或不可访问':s.kind}。${s.url||''}`).join('\n')}
function downloadFile(name,content,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
async function copyText(s){try{await navigator.clipboard.writeText(s);notify('已复制内容')}catch{notify('浏览器未允许复制，请手动选择文本复制')}}
function activeArtifact(){if(currentTask)return currentTask.artifact;const r=route[1]==='items'?db.resources.find(r=>r.id===route[2]):null;return r?.snapshot}
function render(focus=true){route=currentPath().split('/').filter(Boolean);currentTask=route[0]==='tasks'?db.tasks.find(t=>t.id===route[1]):null;const path=currentPath();let html='',title='新建任务';if(!route.length){html=homeView()}else if(route[0]==='tasks'&&currentTask){title='任务工作台';const t=currentTask;const view=route[2]||'plan';html=taskHeader(t,view)+({plan:planView,run:runView,result:resultView,sources:sourcesView,document:documentView,compare:compareView,versions:versionsView,slides:slidesView}[view]||planView)(t)}else if(route[0]==='threads'){title='快速问答';html=threadView(route[1])}else if(route[0]==='history'){title='任务记录';html=historyView()}else if(route[0]==='knowledge'){title='我的知识';html=knowledgeView()}else if(route[0]==='settings'){title='账户与设置';html=settingsView()}else html=empty('页面不存在','该任务或资料可能已删除。',link('返回首页','/','btn primary'));$('#main').innerHTML=html;$('#crumbTitle').textContent=title;document.title=title+' · 百度智搜 Agent';const nav=route[0]==='knowledge'?'knowledge':route[0]==='history'||route[0]==='tasks'||route[0]==='threads'?'history':'new';$$('[data-nav]').forEach(e=>{e.classList.toggle('active',e.dataset.nav===nav);if(e.dataset.nav===nav)e.setAttribute('aria-current','page');else e.removeAttribute('aria-current')});updateSidebar();bindView();enhanceView();if(focus){window.scrollTo(0,scrolls[path]||0);const h=$('#main h1');if(h)h.focus({preventScroll:true})}}

function homeView(){const d=db.draft;return `<div class="home"><div class="welcome"><div class="spark">${icon('spark')}</div><p class="eyebrow">BAIDU ZHISOU AGENT</p><h1>从一个问题，到<span>一份成果</span></h1><p>搜索、核验、整理，让每一步都有依据。</p></div><form id="homeForm"><div class="composer"><label class="sr-only" for="goal">你想完成什么</label><textarea id="goal" placeholder="描述你想完成的事，例如：比较三家厂商，形成带来源的研究简报…">${esc(d.goal)}</textarea><div class="composer-tools"><div class="segments" aria-label="工作模式">${[['quick','快速问答'],['task','任务研究']].map(([v,l])=>`<button type="button" data-action="mode" data-value="${v}" class="${d.mode===v?'active':''}" aria-pressed="${d.mode===v}">${icon(v==='quick'?'search':'spark')} ${l}</button>`).join('')}</div><div class="row"><button class="icon-btn" type="button" data-action="attach" aria-label="添加附件">${icon('attach')}</button><button class="btn primary send-btn" id="submitGoal" aria-label="提交目标" ${!d.goal.trim()?'disabled':''}>${icon('up')}</button></div></div></div><div class="composer-meta"><div class="row">${scopeButton(d.scope)}<label class="sr-only" for="sceneSelect">任务场景</label><select id="sceneSelect" class="pill">${Object.entries(SCENES).map(([k,s])=>`<option value="${k}" ${d.scene===k?'selected':''}>${s.name}</option>`).join('')}</select>${d.example?`<button class="pill" type="button" data-action="remove-example">虚构示例资料 ${icon('close')}</button>`:''}</div><span class="caption" id="charCount">${[...d.goal].length} / 8000 · Enter 提交</span></div><p id="goalError" role="alert" class="status-line error"></p></form>${fileChips(d.scope.files)}<div class="section-head"><h2>从一个场景开始</h2><span class="caption">选择示例，体验完整流程</span></div><div class="scene-grid">${Object.entries(SCENES).filter(([k])=>k!=='general').map(([k,s])=>`<button class="scene-card ${d.scene===k?'selected':''}" data-action="example" data-scene="${k}"><span class="scene-icon">${icon(s.icon)}</span><h3>${s.name} ${icon('arrow')}</h3><p>${s.hint}</p></button>`).join('')}</div><p class="home-note">本地交互演示 · 示例材料均为虚构 · 不执行真实联网检索</p>${db.tasks.length?`<div class="section-head"><h2>继续上次的探索</h2>${link('全部任务 '+icon('arrow'),'/history','caption')}</div>${db.tasks.slice(-2).reverse().map(t=>`<div class="task-row">${icon(SCENES[t.scene].icon)}<div class="grow">${link(esc(t.goal),'/tasks/'+t.id+'/'+(t.artifact?'result':'plan'))}<p>${SCENES[t.scene].name} · ${date(t.updated)}</p></div>${badge(t.status)}</div>`).join('')}`:''}</div>`}
function fileChips(ids){return ids.length?`<div class="file-list">${ids.map(id=>{const f=db.files.find(f=>f.id===id);return f?`<div class="file-chip">${icon('file')}<span>${esc(f.name)} · ${f.status==='ready'?'已读取':esc(f.error||'不可用')}</span><button class="icon-btn" data-action="remove-attachment" data-id="${id}" aria-label="移除 ${esc(f.name)}">${icon('close')}</button></div>`:''}).join('')}</div>`:''}
function planView(t){const locked=['running','pausing'].includes(t.status);return `<form id="planForm" data-id="${t.id}"><div class="two-col"><div class="stack"><div class="card"><div class="row between mb"><h2>先对齐目标，再开始执行</h2>${tag('计划 v'+t.planVersion,'blue')}</div><label class="field"><span>任务目标 <span class="error">*</span></span><textarea class="input" name="goal" required ${locked?'disabled':''}>${esc(t.goal)}</textarea></label><div class="two-equal">${SCENES[t.scene].fields.map(([key,label,hint])=>field(key,label,t.fields[key],hint,key==='budget'?'number':'text',key!=='budget'||!t.fields.unlimited)).join('')}${t.scene==='consumer'?`<label class="check"><input type="checkbox" name="unlimited" ${t.fields.unlimited?'checked':''}>预算不设上限（需要明确选择）</label>`:''}${field('region','地域范围',t.fields.region)}${field('deadline','交付时间',t.fields.deadline,'例如：本周五')}</div>${field('success','成功条件',t.fields.success,'什么样的结果可以交付', 'text',true)}<label class="field"><span>场景工具包</span><select class="input" id="planScene" ${locked?'disabled':''}>${Object.entries(SCENES).map(([k,s])=>`<option value="${k}" ${t.scene===k?'selected':''}>${s.name}</option>`).join('')}</select><small>切换保留目标，重新填写必需字段并确认计划。</small></label><label class="check"><input type="checkbox" name="assumptions" ${t.assumptions?'checked':''}>接受默认假设：未提供地域按中国；未指定责任人、预算和资源保留为待确认。</label></div><div class="card"><div class="row between"><h2>执行步骤</h2><span class="caption">按顺序依赖 · 可调整名称</span></div>${t.steps.map((s,i)=>`<div class="step"><span class="step-index">${i+1}</span><div class="grow"><label class="sr-only" for="step${i}">步骤 ${i+1}</label><input class="input" id="step${i}" name="step${i}" value="${esc(s.name)}" required><p>${i?'依赖步骤 '+i:'起始步骤'} · ${s.status==='success'?'已完成，可复用':'必要步骤'}</p></div>${t.steps.length>3?`<button class="icon-btn" type="button" data-action="remove-step" data-index="${i}" aria-label="移除步骤 ${i+1}">${icon('close')}</button>`:''}</div>`).join('')}${t.steps.length<7?btn(icon('plus')+' 添加步骤','add-step','small ghost mt'):''}<label class="field mt"><span>成果大纲（每行一章）</span><textarea class="input" name="outline" rows="6" required>${esc(t.outline.join('\n'))}</textarea></label></div></div><aside class="aside-stack"><div class="card"><h3>来源与交付</h3><p class="caption mt">${esc(scopeSummary(t.scope))}</p><div class="mt">${scopeButton(t.scope,t.id)}</div>${t.example?'<p class="note mt">本任务使用虚构示例资料。来源分类、数据和结果仅用于产品评审。</p>':''}<label class="field mt"><span>输出格式</span><select class="input" name="format"><option ${t.format==='Markdown'?'selected':''}>Markdown</option><option ${t.format==='CSV'?'selected':''}>CSV</option></select></label><div class="mini-stat"><span>工具包版本</span><span>${t.scene} · v1.0</span></div></div><div class="card"><h3>执行预算</h3><p class="caption mt">本地演示额度，不扣费。每个演示步骤消耗 1 次。</p><div class="mt">${field('budgetCalls','本次调用上限',t.budget,'','number',true)}</div><div class="mini-stat"><span>预计步骤</span><b>${t.steps.length} 次</b></div><div class="mini-stat"><span>剩余额度</span><b>${Math.max(0,db.quota.limit-db.quota.used)} 次</b></div><p class="caption mt">达到上限停止后续步骤；追加需再次确认。</p></div><div class="card"><h3>确认后才会运行</h3><p class="caption mt">修改目标、来源或计划后，旧确认失效。运行中需先暂停。</p><p id="planError" class="status-line error" role="alert"></p><button class="btn primary" type="submit" style="width:100%" ${locked?'disabled':''}>${icon('play')} 确认计划并演示</button>${locked?btn('暂停后修改','pause','mt') : btn('保存计划草稿','save-plan','ghost mt')}</div></aside></div></form>`}
function runView(t){const done=t.steps.filter(s=>s.status==='success').length;return `<div class="two-col"><div class="stack"><div class="card"><div class="row between"><h2>${t.status==='running'?'正在按计划推进':STATUS[t.status]}</h2>${badge(t.status)}</div><p class="muted mt">${t.status==='running'?'演示引擎正在整理本地资料，不调用搜索服务或大模型。':t.status==='waiting'?'本次预算已用完。可确认追加额度后继续，或结束并保留阶段记录。':'已完成步骤与运行记录保留在本浏览器。'}</p><div class="progress-track"><span style="width:${done/t.steps.length*100}%"></span></div><div class="row between"><span class="caption">${done} / ${t.steps.length} 个既定步骤完成</span><span class="caption">计划 v${t.run?.planVersion||t.planVersion}</span></div><div class="row mt">${t.status==='running'?btn(icon('pause')+' 暂停','pause')+btn(icon('stop')+' 取消任务','cancel-run','danger'):['paused','waiting'].includes(t.status)?btn(icon('play')+' '+(t.status==='waiting'?'追加预算并继续':'继续执行'),'resume','primary')+link('修改计划','/tasks/'+t.id+'/plan','btn')+btn('取消任务','cancel-run','danger'):t.artifact?link('查看成果 '+icon('arrow'),'/tasks/'+t.id+'/result','btn primary'):link('返回计划','/tasks/'+t.id+'/plan','btn primary')}</div></div><div class="card"><h3>阶段与产物</h3>${t.steps.map((s,i)=>`<div class="step ${s.status==='success'?'done':s.status==='running'?'running':''}"><span class="step-index">${s.status==='success'?icon('check'):i+1}</span><div class="grow"><div class="row between"><h3>${esc(s.name)}</h3>${tag({success:'已完成',running:'进行中',pending:'待执行'}[s.status]||'待执行',s.status==='success'?'green':'')}</div><p>${esc(s.output||(s.status==='running'?'正在处理本地演示步骤…':'前序完成后执行'))}</p></div></div>`).join('')}</div></div><aside class="aside-stack"><div class="card"><h3>本次运行</h3><div class="mini-stat"><span>消耗 / 上限</span><b>${t.run?.used||0} / ${t.budget}</b></div><div class="mini-stat"><span>环境</span><span>本地演示</span></div><div class="mini-stat"><span>工具包</span><span>${SCENES[t.scene].name} v1.0</span></div><p class="caption mt">关闭页面后不会继续执行；重开时保留检查点，需手动恢复。</p></div><div class="card"><h3 class="mb">运行记录</h3>${t.events.slice(-8).reverse().map(e=>`<div class="event"><time>${date(e.at)}</time><b>${esc(e.text)}</b></div>`).join('')||'<p class="caption">尚未确认执行。</p>'}</div></aside></div>`}
function reportSections(a){return safeSections(a).map((s,i)=>`<section id="section-${i}"><h2>${esc(s.heading)} ${s.review?tag('待复核','amber'):''}</h2><p style="white-space:pre-wrap">${esc(s.body)}${(s.refs||[]).map(id=>`<button class="citation" data-action="evidence" data-source="${id}" aria-label="查看引用 ${a.sources.findIndex(x=>x.id===id)+1}">${a.sources.findIndex(x=>x.id===id)+1}</button>`).join('')}</p></section>`).join('')}
function resultView(t){if(!t.artifact)return empty('成果还在路上','确认计划并完成演示后，报告会出现在这里。',link(t.status==='running'?'查看执行进度':'查看计划','/tasks/'+t.id+'/'+(t.status==='running'?'run':'plan'),'btn primary'));const a=t.artifact;return `<div class="row between mb"><div class="row">${badge(t.status)}${tag('报告 v'+a.version)}${a.review?tag('包含待复核编辑','amber'):tag(t.example?'演示材料':'资料待核实','amber')}</div><div class="row">${link(icon('edit')+' 编辑文档','/tasks/'+t.id+'/document','btn small')}${btn(icon('download')+' 导出','export','small')}${btn(icon('save')+' 保存到知识','save-knowledge','small primary')}</div></div><div class="report-layout"><article class="card report"><div class="note ${t.status==='partial'?'amber':''}">${t.example?'以下为虚构资料的交互演示，不代表真实市场或产品结论。':'本地资料整理，未执行真实搜索。证据不足的章节保持待核实。'}${t.status==='partial'?' 必要信息仍有缺口，本任务为部分完成。':''}</div>${reportSections(a)}${t.scene==='office'?officeChecklist(t):''}${t.scene==='consumer'?consumerChecklist(t):''}${t.example&&t.scene==='industry'?`<h2>样例数据概览</h2><p class="caption">2026 年 9 月 · 固定样例 100 项 · 完成比例（虚构）</p><div class="bar-chart">${t.table.filter(r=>r.period==='2026-09').map(r=>`<div class="bar-row"><span>${esc(r.name)}</span><div class="bar"><span style="width:${r.value}%"></span></div><b>${r.value}%</b></div>`).join('')}</div><p class="caption">产品 C 统计期不同，未纳入图表；数据和来源见对比工作表。</p>`:''}<div class="row mt">${link(icon('grid')+' 对比工作表','/tasks/'+t.id+'/compare','btn')}${link(icon('slides')+' 制作汇报大纲','/tasks/'+t.id+'/slides','btn')}${link(icon('history')+' 版本记录','/tasks/'+t.id+'/versions','btn')}</div><div class="page-footer row between"><span>保存和导出不会改变证据核验状态。</span>${btn(t.accepted?'已标记可用于下一步':'标记成果可用','accept-result','small ghost')}</div></article><aside class="card outline"><h3>报告大纲</h3><div class="mt">${a.sections.map((s,i)=>`<a href="#section-${i}" data-action="jump-section" data-index="${i}">${esc(s.heading)}</a>`).join('')}</div><div class="page-footer"><p>${icon('shield')} 每个结论，都可以回到依据</p>${btn('查看全部资料','go-sources','small ghost mt')}</div></aside></div>`}
function officeChecklist(t){return `<h2>执行前检查</h2><div class="table-wrap"><table><thead><tr><th>事项</th><th>当前状态</th></tr></thead><tbody>${[['责任角色','待指定具体负责人'],['交付时间',t.fields.deadline||'待确认'],['预算',t.fields.budget?t.fields.budget+' 元':'未提供，不按零处理'],['成功条件',t.fields.success],['业务指标','需要提供业务基线与目标']].map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>`}
function consumerChecklist(t){const eligible=(t.table||[]).filter(r=>t.fields.unlimited||(r.price!=null&&r.price<=Number(t.fields.budget)));return `<h2>候选与购买前核对</h2><div class="note ${eligible.length?'':'amber'}">${eligible.length?'当前预算范围内：'+esc(eligible.map(r=>r.name).join('、'))+'。是否适合仍需确认用途与完整参数。':'当前没有符合预算且报价明确的候选。请调整约束或补充候选，不建议勉强购买。'}</div><div class="mt">${['确认型号、内存版本与地区','核对优惠门槛、运费与最终价格','核对官方保修及退换政策（当前未提供）','确认缺失参数；评价提及次数不代表故障率'].map((s,i)=>`<label class="check"><input type="checkbox" data-checklist="${i}" ${t.purchaseChecks?.includes(i)?'checked':''}>${s}</label>`).join('')}</div>`}
function sourcesView(t){const sources=t.artifact?.sources||sourceSet(t);const list=sources.filter(s=>!sourceFilter||s.access===sourceFilter);return `<div class="two-col"><div class="card"><div class="row between mb"><h2>本任务的资料</h2><select class="input" id="sourceFilter" style="width:auto" aria-label="按访问状态筛选"><option value="">全部状态</option><option value="available" ${sourceFilter==='available'?'selected':''}>可访问</option><option value="restricted" ${sourceFilter==='restricted'?'selected':''}>访问受限</option></select></div>${list.length?list.map(s=>`<div class="source-row"><div class="source-icon">${icon(s.fileId?'file':'globe')}</div><div class="grow"><h3>${esc(s.title)}</h3><p>${esc(s.publisher)} · ${esc(s.date)} · ${esc(s.locator)}</p><div class="row">${tag(s.level)}${tag(accessible(s)?s.kind:'不可访问',accessible(s)?'':'amber')}${sources.filter(x=>x.group===s.group).length>1?tag('同一转载组'):''}</div></div>${btn('核验','evidence','small',`data-source="${s.id}"`)}</div>`).join(''):empty('还没有可用资料','全网检索未接入。可添加本地文本资料或回到首页选择示例。')}</div><aside class="aside-stack"><div class="card"><h3>覆盖检查</h3>${t.outline.map((s,i)=>`<div class="mini-stat"><span>${esc(s)}</span>${tag(i===2&&sources.some(accessible)?'有资料':'需核查',i===2?'':'amber')}</div>`).join('')}</div><div class="note">同稿转载只计为一组来源。L1–L4 反映发布主体和资料性质，不代表结论必然正确。</div></aside></div>`}
function documentView(t){if(!t.artifact)return resultView(t);let draft=editorDrafts[t.id];if(!draft){draft={base:t.artifact.version,sections:clone(safeSections(t.artifact)),dirty:false};editorDrafts[t.id]=draft}return `<div class="row between mb"><div class="row">${tag('编辑稿 · 基于 v'+draft.base)}<span class="caption" id="editStatus">${draft.dirty?'有未保存的更改':'已保存到本浏览器'}</span></div><div class="row">${link('返回报告','/tasks/'+t.id+'/result','btn small')}${btn(icon('save')+' 保存新版本','save-document','primary small')}</div></div><div class="note amber mb">修改事实内容后，对应引用标记为待复核。本地版本不能替代人工或联网核验。</div><div class="editor-layout"><aside class="card editor-outline"><h3>文档大纲</h3>${draft.sections.map((s,i)=>`<button data-action="jump-editor" data-index="${i}">${esc(s.heading)}</button>`).join('')}${btn(icon('plus')+' 添加章节','add-section','small ghost')}</aside><form id="editorForm" class="card">${draft.sections.map((s,i)=>`<div class="editor-block" id="edit-${i}"><label class="sr-only" for="heading-${i}">章节 ${i+1} 标题</label><input id="heading-${i}" class="input" data-edit-heading="${i}" value="${esc(s.heading)}"><label class="sr-only" for="body-${i}">章节 ${i+1} 正文</label><textarea id="body-${i}" class="input" data-edit-body="${i}" rows="6">${esc(s.body)}</textarea><div class="row between"><span class="caption">${s.review?'待复核':(s.refs||[]).length+' 条引用'}</span>${btn('添加修改批注','section-comment','small ghost',`data-index="${i}"`)}</div>${s.comment?`<p class="note">修改批注：${esc(s.comment)}</p>`:''}</div>`).join('')}</form></div>`}
function compareView(t){if(!t.artifact)return resultView(t);const table=t.table||[],consumer=t.scene==='consumer',office=t.scene==='office';const weights=t.weights||[35,25,40];const total=weights.reduce((a,b)=>a+b,0);const eligible=table.filter(r=>!consumer||t.fields.unlimited||(r.price!=null&&r.price<=Number(t.fields.budget)));const comparable=!consumer&&!office&&new Set(table.filter(r=>r.value!=null).map(r=>r.period+'|'+r.unit)).size>1;const val=x=>x==null?'未知':esc(x);const head=office?['事项','数量','单价（元）','金额（元）','时间','来源']:consumer?['候选','价格（元）','重量（kg）','续航（h）','约束与评分','来源']:['对象','完成比例（%）','统计期','单位','可比状态','来源'];function score(r){if(!t.weighting)return '未启用评分';if(total!==100)return '权重须合计 100%';if(!eligible.includes(r))return '超出预算';if(['price','weight','battery'].some(k=>r[k]==null))return '缺数据，不计分';let sum=0;for(const [i,k] of ['price','weight','battery'].entries()){const nums=eligible.map(x=>x[k]).filter(x=>x!=null),min=Math.min(...nums),max=Math.max(...nums);sum+=(max===min?1:k==='battery'?(r[k]-min)/(max-min):(max-r[k])/(max-min))*weights[i]}return sum.toFixed(1)+' / 100'}const rows=table.map((r,i)=>{const data=office?[r.name,val(r.quantity),val(r.price),r.quantity==null||r.price==null?'待补数据':(r.quantity*r.price).toFixed(2),r.period]:consumer?[r.name,val(r.price),val(r.weight),val(r.battery),!eligible.includes(r)?'超出预算':score(r)]:[r.name,val(r.value),r.period,r.unit,comparable?'统计期不同，不直接排名':'同口径待核验'];return {r,i,data}});return `<div class="row between mb"><div><h2>${office?'预算与资源表':consumer?'候选比较与取舍':'对象与指标对比'}</h2><p class="caption mt">${t.example?'以下为虚构样例数据，用于验证计算与证据链。':'只有实际输入的数据参与计算；未知值不按零处理。'}</p></div><div class="row">${btn('编辑数据','edit-table','small')}${btn(icon('download')+' 导出 CSV','export','small', 'data-format="CSV"')}</div></div>${consumer?`<div class="card mb"><div class="row between"><h3>先满足预算，再比较偏好</h3><label class="check"><input id="weightToggle" type="checkbox" ${t.weighting?'checked':''}>启用加权比较</label></div><p class="caption">预算：${t.fields.unlimited?'不设上限':esc(t.fields.budget)+' 元'} · ${eligible.length} 个候选符合价格约束；完整用途匹配仍需核实。</p>${t.weighting?`<div class="two-equal mt"><div class="stack">${['价格（越低越好）','重量（越低越好）','续航（越高越好）'].map((s,i)=>`<label class="range-row"><span>${s}</span><input type="range" min="0" max="100" value="${weights[i]}" data-weight="${i}"><output>${weights[i]}%</output></label>`).join('')}</div><div class="note ${total!==100?'amber':''}">权重合计 ${total}%。效益型按 (x−min)/(max−min)，成本型反向。相同值统一记 1（无区分度）；必选数据缺失不计分。修改候选会改变归一化范围。</div></div>`:''}</div>`:''}${comparable?'<div class="note amber mb">统计期或单位不同，已阻止直接排名。请先确认可比口径。</div>':''}<div class="table-wrap desktop-compare"><table class="wide-table"><thead><tr>${head.map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${rows.map(({r,data})=>`<tr>${data.map(s=>`<td>${esc(s)}</td>`).join('')}<td>${r.source?btn('查看依据','evidence','small ghost',`data-source="${r.source}"`):tag('用户输入，待核实','amber')}</td></tr>`).join('')}</tbody></table></div><div class="mobile-cards">${rows.map(({r,data})=>`<div class="card"><h3>${esc(r.name)}</h3>${data.slice(1).map((s,i)=>`<div class="mini-stat"><span>${head[i+1]}</span><span>${esc(s)}</span></div>`).join('')}${r.source?btn('查看依据','evidence','small mt',`data-source="${r.source}"`):tag('待核实','amber')}</div>`).join('')}</div><div class="note mt">${office?'金额 = 数量 × 单价；缺任一输入则不计算合计，预算与负责人均由用户确认。':consumer?'当前报价只含样例 SKU、示例地区与普通售价；未提供真实优惠、渠道与售后数据，不判断全网最低价。':'比例 = 完成数量 ÷ 同一测试集总量 × 100%。不同月份结果不能被画成连续趋势。'}</div>${link('返回报告','/tasks/'+t.id+'/result','btn mt')}`}
function versionsView(t){if(!t.artifact)return resultView(t);const prev=t.versions.at(-2);return `<div class="two-col"><div class="stack"><h2>成果版本</h2>${t.versions.slice().reverse().map(a=>`<div class="version-card row between"><div><h3>报告 v${a.version} ${a.version===t.artifact.version?tag('当前版本','blue'):''}</h3><p class="caption">${date(a.created)} · 基于计划 v${a.planVersion} · ${a.review?'含待复核修改':'初始证据状态'}</p></div>${a.version!==t.artifact.version?btn('另存恢复','restore-version','small',`data-version="${a.version}"`):''}</div>`).join('')}${prev?`<h3>最近两版变化</h3>${safeSections(t.artifact).map((s,i)=>{const old=safeSections(prev).find(x=>x.id===s.id);return !old||old.body!==s.body||old.heading!==s.heading?`<div><h3 class="mb">${esc(s.heading)}</h3><div class="two-equal"><div class="diff-old"><b>v${prev.version}</b>\n${esc(old?.body||'新增章节')}</div><div class="diff-new"><b>v${t.artifact.version}</b>\n${esc(s.body)}</div></div></div>`:''}).join('')||'<p class="caption">正文相同，数据或版本元信息有变化。</p>'}`:''}</div><aside class="note">恢复会生成一个新版本，旧版本保持只读。不可访问的源文不会因恢复旧版本而重新开放。</aside></div>`}
function slidesView(t){if(!t.artifact)return resultView(t);if(!t.slides){return `<div class="card" style="max-width:800px"><h2>先确认汇报大纲</h2><p class="muted mt">将当前报告组织成可编辑页面。单页修改不会影响其他页面。</p><form id="slidesOutline" class="mt">${field('audience','汇报受众',t.fields.audience,'例如：项目评审团队','text',true)}${field('duration','汇报时长（分钟）','10','','number',true)}<label class="field"><span>页面标题（每行一页，3–12 页）</span><textarea class="input" name="titles" rows="8">${esc([t.goal,...t.artifact.sections.map(s=>s.heading),'来源与限制'].join('\n'))}</textarea></label><p class="note">本地版本提供逐页编辑与浏览器打印。PPTX 导出未接入，不显示不可用的下载入口。</p><button class="btn primary mt">确认大纲并生成页面</button></form></div>`}const n=Math.min(slideSelected[t.id]||0,t.slides.length-1),slide=t.slides[n];return `<div class="row between mb"><h2>汇报页面 <span class="muted">${n+1} / ${t.slides.length}</span></h2><div class="row">${btn('播放当前页','present-slide','small')}${btn('保存本页','save-slide','primary small')}</div></div><div class="editor-layout"><div class="slide-thumbs">${t.slides.map((s,i)=>`<button class="slide-thumb ${i===n?'active':''}" data-action="select-slide" data-index="${i}"><span class="caption">${String(i+1).padStart(2,'0')}</span><p>${esc(s.title)}</p></button>`).join('')}</div><div><div class="slide-preview"><p class="eyebrow">百度智搜 · 汇报</p><h2>${esc(slide.title)}</h2><p>${esc(slide.body).slice(0,400)}</p><footer>报告 v${t.artifact.version} · ${t.example?'虚构样例资料':'本地资料'} · ${n+1}</footer></div><form id="slideForm" class="card mt">${field('title','页面标题',slide.title)}<label class="field"><span>页面正文</span><textarea class="input" name="body" rows="5">${esc(slide.body)}</textarea></label><label class="field"><span>讲稿备注</span><textarea class="input" name="notes">${esc(slide.notes||'')}</textarea></label><div class="row">${btn('上移','move-slide-up','small',n===0?'disabled':'')}${btn('下移','move-slide-down','small',n===t.slides.length-1?'disabled':'')}</div></form></div></div>`}
function threadView(id){const th=db.threads.find(x=>x.id===id);if(!th)return empty('会话不存在','可能已被删除。',link('开始新问题','/','btn'));return pageHead('快速问答',th.title,'连续追问沿用本轮已选范围，不自动读取全部知识。',scopeButton(th.scope,'thread:'+th.id))+`<div style="max-width:850px;margin:auto">${th.turns.map((turn,i)=>`<div class="answer-block"><div class="question-bubble">${esc(turn.question)}</div><div class="row mb">${icon('spark')}<strong>智搜</strong>${tag('本地资料回答')}</div><div class="report"><p style="white-space:pre-wrap">${esc(safeTurnAnswer(turn))}</p>${turn.sources.map((s,j)=>`<button class="citation" data-action="thread-evidence" data-turn="${i}" data-source="${s.id}" aria-label="查看本轮引用 ${j+1}">${j+1}</button>`).join('')}<p class="note">${turn.sources.length?'以上展示匹配条目原文，未执行模型总结或独立事实核验。':'没有找到所选范围内的可用资料，未编造引用。可补充文本文件、明确选择知识空间，或转为任务。'}</p></div><div class="row mt">${btn(icon('copy')+' 复制','copy-answer','small ghost',`data-turn="${i}"`)}${btn('转为任务','thread-to-task','small',`data-turn="${i}"`)}${btn('保存到知识','save-answer','small',`data-turn="${i}"`)}</div></div>`).join('')}<form id="followupForm" class="sticky-compose"><label class="sr-only" for="followup">继续追问</label><textarea id="followup" placeholder="继续提问，也可以调整来源范围…" rows="2">${esc(viewDrafts[id]||'')}</textarea><button class="btn primary send-btn" aria-label="发送追问">${icon('up')}</button></form></div>`}
function historyRows(){const q=historyFilter.q.toLowerCase();const all=[...db.tasks.map(t=>({...t,type:'task'})),...db.threads.map(t=>({...t,goal:t.title,type:'thread',status:'completed',scene:'general'}))].filter(t=>!!t.archived===historyFilter.archived&&(!q||t.goal.toLowerCase().includes(q))&&(!historyFilter.scene||t.scene===historyFilter.scene)&&(!historyFilter.status||t.status===historyFilter.status)).sort((a,b)=>b.created.localeCompare(a.created));return all.length?all.map(t=>`<div class="task-row"><div class="source-icon">${icon(t.type==='thread'?'search':SCENES[t.scene].icon)}</div><div class="grow"><button class="task-title" data-action="open-history" data-id="${t.id}" data-type="${t.type}">${esc(t.goal)}</button><p>${t.type==='thread'?'快速问答':SCENES[t.scene].name} · ${date(t.updated||t.created)} ${t.artifact?'· 报告 v'+t.artifact.version:''}</p></div><div class="row">${t.type==='thread'?tag('会话'):badge(t.status)}${btn(t.archived?'移回记录':'归档','archive','small ghost',`data-id="${t.id}" data-type="${t.type}"`)}<button class="icon-btn" data-action="delete-task" data-id="${t.id}" data-type="${t.type}" aria-label="删除 ${esc(t.goal)}">${icon('trash')}</button></div></div>`).join(''):empty('暂无匹配的记录','调整筛选条件，或开始一项新任务。',link('新建任务','/','btn primary'))}
function historyView(){return pageHead('YOUR WORK','任务记录','每次探索都有来处，也可以从这里继续。',link(icon('plus')+' 新建任务','/','btn primary'))+`<div class="filters"><div class="search-field">${icon('search')}<input id="historySearch" class="input" placeholder="搜索任务或会话" aria-label="搜索任务或会话" value="${esc(historyFilter.q)}"></div><select id="historyScene" class="input" aria-label="筛选场景"><option value="">全部场景</option>${Object.entries(SCENES).map(([k,s])=>`<option value="${k}" ${historyFilter.scene===k?'selected':''}>${s.name}</option>`).join('')}</select><select id="historyStatus" class="input" aria-label="筛选状态"><option value="">全部状态</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${historyFilter.status===k?'selected':''}>${v}</option>`).join('')}</select><label class="check"><input type="checkbox" id="showArchived" ${historyFilter.archived?'checked':''}>已归档</label></div><div class="card" id="historyList">${historyRows()}</div>`}
function knowledgeNav(active){return `<nav class="tabs" aria-label="知识页面">${[['','知识空间'],['sources','数据源'],['updates','关注与更新']].map(([v,l])=>link(l,'/knowledge'+(v?'/'+v:''),v===active?'active':'')).join('')}</nav>`}
function resourceRows(resources,spaceId=''){return resources.length?resources.map(r=>`<div class="task-row"><div class="source-icon">${icon(r.type==='note'?'edit':r.type==='file'?'file':'book')}</div><div class="grow">${link(esc(r.title),'/knowledge/items/'+r.id)}<p>${r.type==='note'?'笔记':r.type==='file'?'文件':'已存成果'} · v${r.version} · ${date(r.checked)} · 默认私有</p><div class="row">${r.excluded?tag('已排除','amber'):tag(r.indexStatus==='ready'?'可用于当前范围':'未索引')}${(r.tags||[]).map(s=>tag(s)).join('')}</div></div><div class="row">${spaceId?btn('移出空间','unbind-resource','small ghost',`data-id="${r.id}" data-space="${spaceId}"`):''}${btn(icon('trash'),'delete-resource','ghost small',`data-id="${r.id}" aria-label="删除知识条目"`)}</div></div>`).join(''):empty('还没有资料','保存报告、创建笔记，或添加本地文本资料。')}
function knowledgeView(){if(route[1]==='sources')return dataSourcesView();if(route[1]==='updates')return updatesView();if(route[1]==='items')return itemView(route[2]);if(route[1]==='notes')return noteView(route[2]);if(route[1]==='spaces'){const s=db.spaces.find(s=>s.id===route[2]);if(!s)return empty('空间不存在','请返回知识总览。',link('我的知识','/knowledge','btn'));const resources=db.resources.filter(r=>!r.deleted&&r.spaces.includes(s.id)&&(!knowledgeQuery||r.title.includes(knowledgeQuery)||(r.tags||[]).some(t=>t.includes(knowledgeQuery))));return pageHead('KNOWLEDGE SPACE',s.name,s.description,btn('重命名','rename-space','small',`data-id="${s.id}"`)+btn(icon('plus')+' 添加笔记','new-note','small primary',`data-space="${s.id}"`))+`<div class="card mb"><h3>在这个空间里提问</h3><form id="spaceQuestion" class="row mt" data-space="${s.id}"><input class="input grow" name="question" placeholder="从这个空间的资料中查找…" aria-label="空间内问题" required><button class="btn primary">${icon('search')} 提问</button></form><p class="caption mt">默认仅使用「${esc(s.name)}」。需要全网时，进入会话明确扩大范围。</p></div><div class="row between mb"><h2>资料与成果</h2>${btn('关联已有条目','bind-resource','small',`data-space="${s.id}"`)}</div><div class="filters"><div class="search-field">${icon('search')}<input id="knowledgeSearch" class="input" value="${esc(knowledgeQuery)}" placeholder="搜索标题或标签" aria-label="搜索知识"></div></div><div class="card" id="resourceList">${resourceRows(resources,s.id)}</div>`}const all=db.resources.filter(r=>!r.deleted&&(!knowledgeQuery||r.title.includes(knowledgeQuery)||(r.tags||[]).some(t=>t.includes(knowledgeQuery))));return pageHead('YOUR KNOWLEDGE','我的知识','只保存你确认有价值的内容，让下一次探索有据可循。',btn(icon('plus')+' 新建空间','new-space','primary'))+knowledgeNav('')+`<div class="cards-grid">${db.spaces.map(s=>`<a href="#/knowledge/spaces/${s.id}" class="card resource-card" style="color:inherit"><div class="row between">${icon('folder')}${tag('个人空间')}</div><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p><div class="row between"><span class="caption">${db.resources.filter(r=>!r.deleted&&r.spaces.includes(s.id)).length} 个条目</span>${icon('arrow')}</div></a>`).join('')}</div><div class="section-head"><h2>最近保存</h2><span class="caption">不会自动保存所有对话</span></div><div class="search-field mb">${icon('search')}<input id="knowledgeSearch" class="input" value="${esc(knowledgeQuery)}" placeholder="搜索标题或标签" aria-label="搜索知识"></div><div class="card" id="resourceList">${resourceRows(all.slice().reverse())}</div>`}
function itemView(id){const r=db.resources.find(r=>r.id===id&&!r.deleted);if(!r)return empty('条目已删除或不可用','旧链接不能重新访问已删除资料。',link('返回知识总览','/knowledge','btn'));return pageHead('PRIVATE KNOWLEDGE',r.title,`v${r.version} · 保存于 ${date(r.created)} · 最近核查 ${date(r.checked)}`,r.type==='note'?link(icon('edit')+' 编辑笔记','/knowledge/notes/'+r.id,'btn small'):btn('按此新建任务','reuse-resource','small',`data-id="${id}"`))+`<div class="two-col"><article class="card report">${r.excluded?'<div class="note amber">此条目已排除，不参与新的知识检索。</div>':''}<div class="note mb">历史快照，不代表当前事实。原始资料的权限与删除状态仍然有效。</div>${r.snapshot?reportSections(r.snapshot):`<p style="white-space:pre-wrap">${esc(resourceBody(r))}</p>`}</article><aside class="aside-stack"><div class="card"><h3>来源与位置</h3><div class="mini-stat"><span>访问范围</span><span>仅当前浏览器</span></div><div class="mini-stat"><span>类型</span><span>${r.type==='note'?'笔记':r.type==='file'?'文件':'成果快照'}</span></div><p class="caption mt">所属空间：${r.spaces.map(id=>esc(db.spaces.find(s=>s.id===id)?.name||'未知')).join('、')||'尚未关联'}</p>${r.taskId?db.tasks.some(t=>t.id===r.taskId)?link('查看原任务 '+icon('external'),'/tasks/'+r.taskId+'/result','btn small mt'):'<p class="caption mt">原任务已删除，独立知识快照保留。</p>':''}</div><div class="card stack">${btn(r.excluded?'恢复参与检索':'排除此条目','exclude-resource','',`data-id="${id}"`)}${btn('设置关注','watch-resource','',`data-id="${id}"`)}${btn('删除条目','delete-resource','danger',`data-id="${id}"`)}</div></aside></div>`}
function noteView(id){const r=db.resources.find(r=>r.id===id&&!r.deleted);if(!r)return empty('笔记不存在','请从知识空间创建笔记。');return pageHead('NOTE','编辑笔记','草稿仅保存在当前浏览器，保存后才加入可检索资料。',btn(icon('save')+' 保存并索引','save-note','primary',`data-id="${id}"`))+`<form id="noteForm" class="card" data-id="${id}" style="max-width:900px;margin:auto">${field('title','标题',r.draft?.title||r.title)}<label class="field"><span>正文</span><textarea class="input" name="body" rows="16">${esc(r.draft?.body??r.body??'')}</textarea></label>${field('tags','标签（用逗号分隔）',(r.tags||[]).join('，'))}<div class="row between"><span class="caption" id="noteStatus">${r.draft?'有已恢复的本地草稿':'已保存版本 v'+r.version}</span>${tag(r.indexStatus==='ready'?'已索引':'未索引','amber')}</div></form>`}

function searchResults(q){q=q.trim().toLowerCase();if(!q)return '<p class="empty" style="padding:24px">输入名称，查找任务、会话或知识条目。</p>';const results=[...db.tasks.map(t=>({title:t.goal,type:'任务 · '+SCENES[t.scene].name,path:'/tasks/'+t.id+'/'+(t.status==='running'?'run':t.artifact?'result':'plan')})),...db.threads.map(t=>({title:t.title,type:'会话',path:'/threads/'+t.id})),...db.resources.filter(r=>!r.deleted).map(r=>({title:r.title,type:r.type==='note'?'笔记':'知识',path:'/knowledge/items/'+r.id}))].filter(r=>r.title.toLowerCase().includes(q));return results.length?results.slice(0,20).map(r=>`<a class="search-result" href="#${r.path}"><span>${icon(r.type==='笔记'?'edit':'file')}</span><span class="grow"><strong>${esc(r.title)}</strong><small>${r.type}</small></span>${icon('arrow')}</a>`).join(''):empty('没有找到匹配内容','试试更短的关键词。')}

function versionDataTable(v){const rows=v.table||[];if(!rows.length)return '<p class="caption">本版没有结构化对比数据。</p>';const names={name:'对象',value:'数值',unit:'单位',period:'统计期',price:'价格 / 单价（元）',quantity:'数量',weight:'重量（kg）',battery:'续航（小时）',source:'引用',review:'复核状态'};const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))].filter(k=>k in names&&k!=='source');return '<div class="table-wrap"><table><thead><tr>'+keys.map(k=>'<th>'+names[k]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k]===null||r[k]===undefined?'未知':k==='review'?(r[k]?'待复核':'原状态'):r[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
versionsView=function(t){if(!t.artifact)return oldResult(t);const vs=t.versions;const selected=versionSelection[t.id]||[vs.at(-2)?.version||vs[0].version,vs.at(-1).version];const a=vs.find(x=>x.version===selected[0])||vs[0],b=vs.find(x=>x.version===selected[1])||vs.at(-1);const sa=safeSections(a),sb=safeSections(b),ids=[...new Set([...sa,...sb].map(s=>s.id))],changed=ids.filter(id=>JSON.stringify(sa.find(s=>s.id===id))!==JSON.stringify(sb.find(s=>s.id===id)));return `<div class="row between mb"><div><h2>比较成果版本</h2><p class="caption mt">选择任意两版，核对正文、数据与证据变化。</p></div>${link('返回报告','/tasks/'+t.id+'/result','btn small')}</div><div class="card mb"><div class="two-equal">${[a,b].map((v,i)=>`<label class="field"><span>${i?'比较版本':'基准版本'}</span><select class="input version-select" data-index="${i}">${vs.map(x=>`<option value="${x.version}" ${x.version===v.version?'selected':''}>v${x.version} · ${date(x.created)}${x.version===t.artifact.version?' · 当前':''}</option>`).join('')}</select></label>`).join('')}</div><div class="row">${tag(changed.length+' 个章节变化','blue')}${tag(JSON.stringify(a.table)!==JSON.stringify(b.table)?'数据有变化':'数据未变化')}${tag(JSON.stringify(a.sources)!==JSON.stringify(b.sources)?'来源有变化':'来源未变化')}</div></div>${changed.length?changed.map(id=>{const old=sa.find(s=>s.id===id),newer=sb.find(s=>s.id===id);return `<div class="card mb"><h3 class="mb">${esc(newer?.heading||old.heading)}</h3><div class="two-equal"><div class="diff-old"><b>v${a.version}</b>\n${esc(old?.body||'此版本无该章节')}</div><div class="diff-new"><b>v${b.version}</b>\n${esc(newer?.body||'此版本已删除该章节')}</div></div></div>`}).join(''):'<div class="note mb">所选版本的章节正文一致，可继续检查数据和来源。</div>'}<details class="card mb"><summary>查看数据与引用差异</summary><div class="two-equal mt">${[a,b].map(v=>`<div><h3>v${v.version}</h3><div class="data-diff">${versionDataTable(v)}</div><p class="caption">${v.sources.map(s=>esc(s.title)+' · '+(accessible(s)?'可访问':'不可访问')).join('<br>')}</p></div>`).join('')}</div></details><h3 class="mb">全部版本</h3>${vs.slice().reverse().map(v=>`<div class="version-card row between"><div><strong>报告 v${v.version}</strong><p class="caption">${date(v.created)} · ${v.review?'含待复核修改':'初始证据状态'}</p></div>${v.version!==t.artifact.version?btn('另存恢复','restore-version','small',`data-version="${v.version}"`):tag('当前版本','blue')}</div>`).join('')}`};
sourcesView=function(t){const html=oldSources(t);return html.replaceAll(/(<button type="button" class="btn small" data-action="evidence" data-source="([^"]+)">核验<\/button>)/g,(m,button,id)=>`<div class="row">${button}${t.artifact?btn('排除','exclude-source','small ghost',`data-source="${id}"`):''}</div>`)+(t.excludedSources?.length?`<div class="note mt">已从后续运行排除 ${t.excludedSources.length} 个来源。旧版保留原有来源关系，可在版本记录中查看。</div>`:'')};
documentView=function(t){let html=oldDocument(t);if(!t.artifact)return html;html=html.replaceAll(/(<button type="button" class="btn small ghost" data-action="section-comment" data-index="(\d+)">添加修改批注<\/button>)/g,(m,b,i)=>`<span class="row">${btn('局部修改','rewrite-section','small',`data-index="${i}"`)}${b}</span>`);return `<div class="context-tools row mb">${link(icon('file')+' 报告','/tasks/'+t.id+'/result','btn small')}${link(icon('grid')+' 对比表','/tasks/'+t.id+'/compare','btn small')}${link(icon('history')+' 版本比较','/tasks/'+t.id+'/versions','btn small')}${btn(icon('save')+' 保存到知识','save-knowledge','small')}${btn(icon('download')+' 导出','export','small')}</div>`+html};
slidesView=function(t){let html=oldSlides(t);if(t.slides)html=`<div class="row between mb"><p class="caption">当前方案的汇报附件 · 与任务共用来源</p><div class="row">${link('返回报告','/tasks/'+t.id+'/result','btn small')}${btn(icon('download')+' 导出网页幻灯片','export-slides','small')}</div></div>`+html;return html};
runView=function(t){let html=oldRun(t);return html+`<details class="run-events card mt"><summary>查看完整运行记录 <span class="caption">${t.events.length} 条</span></summary><div class="mt">${t.events.map(e=>`<div class="event"><time>${date(e.at)}</time><b>${esc(e.text)}</b></div>`).join('')||'<p class="caption">尚无运行事件。</p>'}</div></details>`};
resultView=function(t){return oldResult(t)};
itemView=function(id){const r=db.resources.find(r=>r.id===id&&!r.deleted);let html=oldItem(id);if(r)html+=`<div class="card mt"><div class="row between"><h3>知识版本与组织</h3><div class="row">${btn('编辑标题与标签','edit-resource-meta','small',`data-id="${id}"`)}${btn('查看保存历史','resource-history','small',`data-id="${id}"`)}</div></div><p class="caption mt">同一资源可关联多个空间；移出只改变归属，不删除原内容。</p></div>`;return html};
threadView=function(id){let html=oldThread(id);const th=db.threads.find(t=>t.id===id);if(th)html=html.replace('连续追问沿用本轮已选范围，不自动读取全部知识。',`${DEPTHS[th.depth||'concise'].name}模式 · 连续追问沿用本轮已选范围，不自动读取全部知识。`);return html};
updatesView=function(){return pageHead('FOLLOW UP','关注与更新','需要记住的变化，集中在这里处理。',btn(icon('plus')+' 新建关注','new-watch','primary'))+knowledgeNav('updates')+`<div class="summary-grid"><div><span>关注主题</span><strong>${db.watches.length}</strong></div><div><span>配置启用</span><strong>${db.watches.filter(w=>w.active).length}</strong></div><div><span>待审阅</span><strong>${db.watches.filter(w=>w.proposal).length}</strong></div></div><div class="note mb">当前保存本地关注配置，尚未接入真实定时查新。手动检查会报告实际可用性；虚构成果可单独体验“变化审阅示例”。</div>${db.watches.length?db.watches.map(w=>`<div class="card watch-card mb"><div class="row between"><div class="row"><span class="source-icon">${icon('bell')}</span><div><h3>${esc(w.title)}</h3><p class="caption">${w.period==='daily'?'每日':'每周'} · 每次 ${w.budget} 次额度 · ${w.active?'等待调度接入':'已暂停'} · v${w.version}</p></div></div><div class="row">${btn('编辑','edit-watch','small',`data-id="${w.id}"`)}${btn(w.active?'暂停':'恢复配置','toggle-watch','small',`data-id="${w.id}"`)}${btn(icon('trash'),'remove-watch','small ghost',`data-id="${w.id}" aria-label="删除关注"`)}</div></div><div class="row mt">${btn('手动检查','check-watch','small',`data-id="${w.id}"`)}${db.resources.find(r=>r.id===w.resourceId&&!r.deleted)?.snapshot?.example?btn(w.proposal?'审阅待确认变化':'体验变化审阅示例','watch-proposal','small',`data-id="${w.id}"`):''}${link('查看关联知识','/knowledge/items/'+w.resourceId,'btn small ghost')}</div><details class="mt"><summary>运行历史 ${tag((w.history?.length||0)+' 条')}</summary><div class="mt">${(w.history||[]).slice().reverse().map(h=>`<div class="event"><time>${date(h.at)}</time><b>${esc(h.result)}</b></div>`).join('')||'<p class="caption">尚未执行任何检查。</p>'}</div></details></div>`).join(''):empty('还没有关注事项','选择一份已保存的知识，记录希望后续核查的主题。',btn('新建关注','new-watch','primary'))}`};
function editWatch(id,resourceId){const w=id?db.watches.find(w=>w.id===id):null;const resources=db.resources.filter(r=>!r.deleted);if(!resources.length){showDialog('先保存一份知识',empty('还没有可关注的知识','完成任务后保存成果，或创建一份笔记。',link('前往我的知识','/knowledge','btn primary')));return}dialogContext={editWatchId:id};showDialog(w?'编辑关注配置':'新建关注',`<form id="watchEditForm">${field('title','关注主题',w?.title||'','','text',true)}<label class="field"><span>关联知识</span><select class="input" name="resource">${resources.map(r=>`<option value="${r.id}" ${(w?.resourceId||resourceId)===r.id?'selected':''}>${esc(r.title)}</option>`).join('')}</select></label><div class="two-equal"><label class="field"><span>计划周期</span><select class="input" name="period"><option value="weekly" ${w?.period==='weekly'?'selected':''}>每周</option><option value="daily" ${w?.period==='daily'?'selected':''}>每日</option></select></label>${field('budget','单次额度上限',w?.budget||5,'','number',true)}</div><p class="note">显式保存配置；真正的定时查新须接入服务，不会发送站外通知。</p></form>`,btn('取消','close-dialog')+btn('保存配置','save-watch-edit','primary'))}
function showWatchProposal(w){const r=db.resources.find(r=>r.id===w.resourceId&&!r.deleted);if(!r?.snapshot?.example){notify('仅虚构成果提供变化演示，真实知识不会自动补造更新');return}if(!w.proposal){w.proposal={id:uid('proposal'),base:r.version,created:now(),old:r.snapshot.sections.at(-1).body,new:r.snapshot.sections.at(-1).body+'\n\n【变化审阅示例】新增核查事项：确认统计期间与最新来源是否一致。此项为虚构流程演示，并非真实查新结果。'};persist()}dialogContext={watchId:w.id};showDialog('审阅变化示例',`<p class="note amber mb">虚构更新示例。确认前不会修改知识；可忽略并保留旧版。</p><div class="two-equal"><div class="diff-old"><b>原知识 v${w.proposal.base}</b>\n${esc(w.proposal.old)}</div><div class="diff-new"><b>待确认内容</b>\n${esc(w.proposal.new)}</div></div>`,btn('稍后处理','close-dialog')+btn('忽略变化','reject-proposal')+btn('确认更新示例知识','accept-proposal','primary'),true)}
function showRewrite(index){const d=editorDrafts[currentTask.id],s=d.sections[index];dialogContext={rewriteIndex:index};showDialog('局部修改与差异预览',`<p class="caption mb">只修改选中的章节，其余内容保持不变。当前使用手工修改，不调用模型。</p><h3 class="mb">${esc(s.heading)}</h3><form id="rewriteForm"><label class="field"><span>当前内容</span><div class="quote">${esc(s.body)}</div></label><label class="field"><span>修改后的内容</span><textarea class="input" name="body" rows="8">${esc(s.body)}</textarea></label></form><p class="note amber">改写事实后标记为待复核，引用不会自动恢复验证状态。</p>`,btn('取消','close-dialog')+btn('预览差异','preview-rewrite','primary'),true)}
function historyReuse(id){const old=db.tasks.find(t=>t.id===id);const n=createTask({goal:old.goal,scene:old.scene,scope:clone(old.scope),example:old.example});n.outline=clone(old.outline);n.steps=old.steps.map((s,i)=>({id:uid('step'),name:s.name,required:true,depends:i?[i-1]:[],status:'pending',output:''}));n.fields={...clone(old.fields),period:'',budget:'',deadline:'',unlimited:false};n.budget=old.budget;n.status='clarifying';n.run=null;n.artifact=null;n.versions=[];n.reusedFrom=id;persist();navigation('/tasks/'+n.id+'/plan');notify('已复用计划结构；期间、预算与时间请重新确认')}
async function enhancedAction(action,b){const t=currentTask;switch(action){
case 'collapse-sidebar':sidebarCollapsed=!sidebarCollapsed;try{localStorage.setItem('zhisou-sidebar-collapsed',String(sidebarCollapsed))}catch{}applySidebar();return true;
case 'depth-drawer':showDepthDrawer();return true;
case 'apply-depth':{const value=new FormData($('#depthForm')).get('depth');db.draft.depth=value;db.draft.mode=value==='research'?'task':'quick';persist();closeDialog();render(false);$('#goal')?.focus();return true}
case 'mention-space':openMentions();return true;
case 'add-mention':{const id=b.dataset.id;if(!db.draft.scope.spaces.includes(id))db.draft.scope.spaces.push(id);db.draft.goal=db.draft.goal.replace(/@$/,'');persist();closeDialog();render(false);$('#goal')?.focus();return true}
case 'starter-prompt':{db.draft.goal=['请梳理我提供的资料，提取关键信息并保留出处。','请比较两个方案的目标、优点、限制和适用条件。','请基于我的资料形成研究报告，并列出尚需核实的问题。'][Number(b.dataset.index)];db.draft.example=false;db.draft.depth=Number(b.dataset.index)===2?'research':'deep';db.draft.mode=db.draft.depth==='research'?'task':'quick';persist();render(false);$('#goal').focus();return true}
case 'global-search':globalSearch();return true;
case 'history-kind':historyFilter.kind=b.dataset.value;historyFilter.page=1;render(false);return true;
case 'history-prev':case 'history-next':historyFilter.page+=(action==='history-prev'?-1:1);$('#historyList').innerHTML=historyRows();return true;
case 'reuse-task':historyReuse(b.dataset.id);return true;
case 'knowledge-type':knowledgeType=b.dataset.value;$$('[data-action=knowledge-type]').forEach(x=>x.classList.toggle('active',x.dataset.value===knowledgeType));$('#resourceList').innerHTML=resourceRows(knowledgeFiltered(),route[2]);return true;
case 'rewrite-section':showRewrite(Number(b.dataset.index));return true;
case 'preview-rewrite':{const body=String(new FormData($('#rewriteForm')).get('body')),index=dialogContext.rewriteIndex,old=editorDrafts[t.id].sections[index].body;dialogContext={rewriteIndex:index,rewriteBody:body};showDialog('确认本段修改',`<div class="two-equal"><div class="diff-old"><b>修改前</b>\n${esc(old)}</div><div class="diff-new"><b>修改后</b>\n${esc(body)}</div></div><p class="note amber mt">仅此段落被替换，保存新版本后可在版本比较中查看差异。</p>`,btn('取消','close-dialog')+btn('接受本段修改','accept-rewrite','primary'),true);return true}
case 'accept-rewrite':{const d=editorDrafts[t.id],s=d.sections[dialogContext.rewriteIndex];s.body=dialogContext.rewriteBody;s.review=true;d.dirty=true;closeDialog();render(false);notify('修改已加入编辑稿，其余章节未改变');return true}
case 'exclude-source':{const id=b.dataset.source,s=t.artifact.sources.find(s=>s.id===id);const affected=t.artifact.sections.filter(x=>(x.refs||[]).includes(id));ask('排除来源并生成待复核版本',`<p>排除「${esc(s.title)}」将影响 ${affected.length} 个章节的引用关系。新版本会明确标出缺口，旧报告与证据保留。</p><p class="note amber mt">这里只处理本地引用关系，不宣称已完成真实重新检索。补充资料后可重新确认计划。</p>`,()=>{const a=clone(t.artifact);a.version=t.versions.length+1;a.created=now();a.review=true;a.sources=a.sources.filter(s=>s.id!==id);a.table=(a.table||[]).map(r=>r.source===id?{...r,source:'',review:true}:r);t.table=clone(a.table);a.sections.forEach(x=>{if((x.refs||[]).includes(id)){x.body='本段引用的来源已排除。请补充有效资料后重新核验，旧版原文保留在版本记录中。';x.refs=x.refs.filter(r=>r!==id);x.review=true}});t.artifact=a;t.versions.push(clone(a));t.excludedSources=[...new Set([...(t.excludedSources||[]),id])];t.status='partial';t.steps.slice(-2).forEach(x=>{x.status='pending';x.output='来源变更，需要重新核验'});t.planVersion++;editorDrafts[t.id]=null;eventLog('source_excluded',{task:t.id,source:id,affected:affected.length});persist();closeDialog();render(false)},'排除并保留旧版',true);return true}
case 'edit-resource-meta':{const r=db.resources.find(r=>r.id===b.dataset.id);dialogContext={metaId:r.id};showDialog('整理知识条目',`<form id="metaForm">${field('title','标题',r.title)}${field('tags','标签（逗号分隔）',(r.tags||[]).join('，'))}<h3>所属空间</h3>${db.spaces.map(s=>`<label class="check"><input type="checkbox" name="space" value="${s.id}" ${r.spaces.includes(s.id)?'checked':''}>${esc(s.name)}</label>`).join('')}</form>`,btn('取消','close-dialog')+btn('保存整理','save-resource-meta','primary'));return true}
case 'save-resource-meta':{const r=db.resources.find(r=>r.id===dialogContext.metaId),f=new FormData($('#metaForm')),title=String(f.get('title')).trim();if(!title){notify('标题不能为空');return true}r.title=title;r.tags=String(f.get('tags')).split(/[,，]/).map(x=>x.trim()).filter(Boolean);r.spaces=f.getAll('space');persist();closeDialog();render(false);return true}
case 'resource-history':{const r=db.resources.find(r=>r.id===b.dataset.id);const histories=[...(r.history||[]),{version:r.version,snapshot:r.snapshot,body:r.body,checked:r.checked}];showDialog('知识保存历史',`<div class="stack">${histories.slice().reverse().map(v=>`<details class="version-card"><summary>知识 v${v.version} · ${date(v.checked)} ${v.version===r.version?'（当前）':''}</summary><div class="quote mt">${esc(v.snapshot?safeSections(v.snapshot).map(x=>x.heading+'\n'+x.body).join('\n\n'):v.body||'此旧版未保存正文快照')}</div></details>`).join('')}</div>`,btn('关闭','close-dialog'),true);return true}
case 'new-watch':editWatch();return true;
case 'edit-watch':editWatch(b.dataset.id);return true;
case 'save-watch-edit':{const f=new FormData($('#watchEditForm')),title=String(f.get('title')).trim(),budget=Number(f.get('budget'));if(!title||!Number.isInteger(budget)||budget<1||budget>200){notify('请填写主题；额度须为 1–200 的整数');return true}const existing=db.watches.find(w=>w.id===dialogContext.editWatchId);const data={title,budget,period:f.get('period'),resourceId:f.get('resource')};if(existing){Object.assign(existing,data);existing.version++;existing.proposal=null}else db.watches.push({id:uid('watch'),...data,active:true,version:1,history:[]});persist();closeDialog();navigation('/knowledge/updates');return true}
case 'remove-watch':{const w=db.watches.find(w=>w.id===b.dataset.id);ask('删除关注配置',`<p>删除「${esc(w.title)}」的关注配置与本地检查记录，原知识不受影响。</p>`,()=>{db.watches=db.watches.filter(x=>x.id!==w.id);persist();closeDialog();render(false)},'删除配置',true);return true}
case 'watch-proposal':showWatchProposal(db.watches.find(w=>w.id===b.dataset.id));return true;

function collectPlan(t,onlyDraft=false){const form=$('#planForm');if(!form)return false;const f=new FormData(form),unlimited=f.has('unlimited');if(!onlyDraft){const names=SCENES[t.scene].fields.map(x=>x[0]).filter(k=>k!=='budget'||!unlimited);const missing=names.some(k=>!String(f.get(k)||'').trim());if(missing){$('#planError').textContent='请补全带 * 的场景必填信息。';return false}if(!f.has('assumptions')&&!String(f.get('region')||'').trim()){$('#planError').textContent='请填写地域，或明确接受默认假设。';return false}}const goal=String(f.get('goal')||'').trim(),outline=String(f.get('outline')||'').split('\n').map(s=>s.trim()).filter(Boolean);const budget=Number(f.get('budgetCalls'));if(!goal||[...goal].length>8000||!outline.length||!Number.isInteger(budget)||budget<1||budget>200){$('#planError').textContent='目标须为 1–8000 字；大纲不能为空；演示预算为 1–200 的整数。';return false}const fields={...t.fields,unlimited};for(const key of Object.keys(t.fields))if(key!=='unlimited')fields[key]=String(f.get(key)??t.fields[key]).trim();if(unlimited)fields.budget='';const steps=t.steps.map((s,i)=>({...s,name:String(f.get('step'+i)||s.name).trim()}));const changed=JSON.stringify([t.goal,t.fields,t.outline,t.budget,t.format,t.assumptions,t.steps.map(s=>s.name)])!==JSON.stringify([goal,fields,outline,budget,String(f.get('format')),f.has('assumptions'),steps.map(s=>s.name)]);if(changed){t.planVersion++;let first=steps.length;if(goal!==t.goal||JSON.stringify(fields)!==JSON.stringify(t.fields)||f.has('assumptions')!==t.assumptions)first=0;else if(JSON.stringify(outline)!==JSON.stringify(t.outline)||String(f.get('format'))!==t.format)first=steps.length-1;steps.forEach((s,i)=>{if(s.name!==t.steps[i]?.name)first=Math.min(first,i)});steps.forEach((s,i)=>{if(i>=first){s.status='pending';s.output=''}});t.rerunFrom=first<steps.length?first:null;}t.goal=goal;t.fields=fields;t.outline=outline;t.budget=budget;t.format=String(f.get('format'));t.assumptions=f.has('assumptions');t.steps=steps;t.status=onlyDraft?'draft':'ready';t.updated=now();persist();return true}

async function readDocx(file){const buffer=await file.arrayBuffer(),v=new DataView(buffer);let end=-1;for(let i=buffer.byteLength-22;i>=Math.max(0,buffer.byteLength-65557);i--)if(v.getUint32(i,true)===0x06054b50){end=i;break}if(end<0)throw Error('文件损坏，无法读取 DOCX 目录');let pos=v.getUint32(end+16,true);const count=v.getUint16(end+10,true);for(let n=0;n<count;n++){if(v.getUint32(pos,true)!==0x02014b50)throw Error('DOCX 结构无效');const flags=v.getUint16(pos+8,true),method=v.getUint16(pos+10,true),size=v.getUint32(pos+20,true),fullSize=v.getUint32(pos+24,true),nameLen=v.getUint16(pos+28,true),extra=v.getUint16(pos+30,true),comment=v.getUint16(pos+32,true),offset=v.getUint32(pos+42,true);const name=new TextDecoder().decode(new Uint8Array(buffer,pos+46,nameLen));if(name==='word/document.xml'){if(flags&1)throw Error('加密文件无法解析');if(fullSize>4*1024*1024)throw Error('正文过大，请提供精简文本');const start=offset+30+v.getUint16(offset+26,true)+v.getUint16(offset+28,true);let bytes=new Uint8Array(buffer,start,size);if(method===8){const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(stream).arrayBuffer())}else if(method!==0)throw Error('当前浏览器不支持此压缩格式');const xml=new DOMParser().parseFromString(new TextDecoder().decode(bytes),'application/xml');if(xml.querySelector('parsererror'))throw Error('正文 XML 损坏');return [...xml.getElementsByTagNameNS('*','p')].map(p=>[...p.getElementsByTagNameNS('*','t')].map(t=>t.textContent).join('')).join('\n')}pos+=46+nameLen+extra+comment}throw Error('缺少正文，可能不是有效 DOCX')}
async function uploadFiles(files){if(files.length>10){notify('每次最多 10 个文件，请重新选择');return}for(const f of files){if(!/\.(pdf|docx|txt|md|markdown)$/i.test(f.name)){notify(f.name+'：不支持此格式');continue}if(f.size>20*1024*1024){notify(f.name+' 超过 20 MB');continue}let text='',error='';try{if(/\.pdf$/i.test(f.name))throw Error('PDF 解析服务未接入，请提供 TXT / Markdown 或 DOCX 正文');text=/\.docx$/i.test(f.name)?await readDocx(f):await f.text();if(!text.trim()||text.includes('\u0000'))throw Error('正文为空或编码不可识别');if(new Blob([text]).size>1024*1024)throw Error('本地正文超过 1 MB，请提供精简材料');if(db.files.filter(x=>!x.deleted).reduce((s,x)=>s+(x.text?.length||0),0)+text.length>1000000)throw Error('本地文本容量不足，请先清理资料');}catch(e){text='';error=e.message}const item={id:uid('file'),name:f.name,size:f.size,text,status:error?'failed':'ready',error,created:now()};db.files.push(item);if(item.status==='ready'&&!route.length)db.draft.scope.files.push(item.id)}persist();render(false);notify('文件处理已完成；仅可用文本参与检索')}

function deleteResource(id){const r=db.resources.find(r=>r.id===id);if(!r)return;const affected=db.tasks.filter(t=>t.artifact?.sources.some(s=>s.resourceId===id));ask('删除知识条目',`<p>「${esc(r.title)}」会从 ${r.spaces.length} 个空间移除，并立即停止检索。${affected.length} 个任务的关联原文将无法展开。</p><p class="caption mt">此本地演示没有回收站。已下载文件无法撤回。</p>`,()=>{revokeSource('resourceId',id);r.deleted=true;r.body='';r.draft=null;r.snapshot=null;r.indexStatus='deleted';eventLog('resource_deleted',{resource:id});persist();closeDialog();navigation('/knowledge')},'确认删除',true)}
async function handleAction(action,b){if(await enhancedAction(action,b))return;const t=currentTask;switch(action){

case 'confirm-action':{const cb=dialogContext.callback;if(cb)cb();break}

case 'scene-select':{const k=b.dataset.scene;if(!SCENES[k])break;db.draft.scene=k;db.draft.example=false;persist();render(false);break}

case 'remove-example':db.draft.example=false;persist();render(false);break;
case 'scope':if($('#planForm')&&t?.status!=='running')collectPlan(t,true);scopeDialog(b.dataset.target||'draft');break;
case 'apply-scope':{const f=new FormData($('#scopeForm'));let sites=String(f.get('sites')).split(/[,，\s]+/).map(s=>s.trim()).filter(Boolean);if(sites.some(s=>!/^([a-z0-9-]+\.)+[a-z]{2,}$/i.test(s))){$('#scopeError').textContent='请填写域名，例如 baidu.com，不填写路径或内网地址。';return}const scope={web:f.has('web'),sites,spaces:f.getAll('space'),files:f.getAll('file')};const target=dialogContext.target;if(target==='draft')db.draft.scope=scope;else if(target.startsWith('thread:'))db.threads.find(x=>x.id===target.slice(7)).scope=scope;else{const x=db.tasks.find(x=>x.id===target);if(x.status==='running'){notify('请先暂停任务');return}x.scope=scope;x.planVersion++;x.status='ready';x.steps.forEach(s=>{s.status='pending';s.output=''})}persist();closeDialog();render(false);break}
case 'attach':$('#fileInput').click();break;
case 'remove-attachment':db.draft.scope.files=db.draft.scope.files.filter(id=>id!==b.dataset.id);persist();render(false);break;

case 'add-step':if(t.status==='running')return;if(collectPlan(t,true)){t.steps.push({id:uid('step'),name:'核查补充资料',status:'pending',required:true,depends:[t.steps.length-1],output:''});t.planVersion++;persist();render(false)}break;
case 'remove-step':if(t.status==='running')return;if(collectPlan(t,true)){t.steps.splice(Number(b.dataset.index),1);t.steps.forEach((s,i)=>s.depends=i?[i-1]:[]);t.planVersion++;persist();render(false)}break;
case 'pause':pauseTask(t);break;
case 'cancel-run':ask('取消这次任务',`<p>停止后续步骤，保留已经完成的阶段记录。已发生的演示消耗不会退回。</p>`,()=>{pauseTask(t,true);closeDialog()},'取消任务',true);break;
case 'resume':if(t.status==='waiting'){ask('追加演示预算',`<p>为本次任务增加 ${t.steps.filter(s=>s.status!=='success').length} 次步骤额度。仅修改本次任务上限，不增加账户总配额。</p>`,()=>{if(db.quota.used>=db.quota.limit){notify('账户演示额度已用尽');return}t.budget+=t.steps.filter(s=>s.status!=='success').length;closeDialog();startRun(t,true)},'确认追加并继续')}else if(t.status==='paused')startRun(t,true);break;

case 'confirm-save':{const f=new FormData($('#saveKnowledgeForm')),c=dialogContext,title=String(f.get('title')).trim();if(!title){notify('请填写条目标题');return}const existing=db.resources.find(r=>!r.deleted&&r.original===c.original&&r.snapshot?.version===c.snapshot.version);if(existing){closeDialog();notify('这一版本已经保存，没有重复创建');navigation('/knowledge/items/'+existing.id);return}const older=db.resources.find(r=>!r.deleted&&r.original===c.original);const item={id:uid('resource'),title,taskId:c.taskId,original:c.original,snapshot:clone(c.snapshot),type:'artifact',version:1,spaces:[String(f.get('space'))],tags:String(f.get('tags')).split(/[,，]/).map(s=>s.trim()).filter(Boolean),created:now(),checked:now(),indexStatus:'ready'};if(older){showDialog('已有该成果的较早版本',`<p>新版本可以更新已有条目，也可以独立另存。旧成果快照仍保留在原任务版本记录中。</p>`,btn('取消','close-dialog')+btn('另存条目','save-new-resource')+btn('更新现有条目','update-resource','primary'));dialogContext={item,olderId:older.id};return}db.resources.push(item);eventLog('knowledge_saved',{resource:item.id});persist();closeDialog();navigation('/knowledge/items/'+item.id);notify('已保存到所选知识空间');break}

case 'export':exportDialog(b.dataset.format||'Markdown');break;
case 'download-export':{const f=new FormData($('#exportForm')),c=dialogContext,format=f.get('format'),privateFlag=f.has('private');const content=format==='CSV'?csvText(c.exportTask,c.exportArtifact,privateFlag):artifactMarkdown(c.exportTask,c.exportArtifact,privateFlag);const name=c.exportTask.goal.replace(/[\\/:*?"<>|]/g,'_').slice(0,60)+'_v'+c.exportArtifact.version+(format==='CSV'?'.csv':'.md');downloadFile(name,content,format==='CSV'?'text/csv;charset=utf-8':'text/markdown;charset=utf-8');eventLog('export_finished',{task:c.exportTask.id,version:c.exportArtifact.version,format,status:'browser_download_requested'});persist();$('#exportStatus').textContent='文件已生成并交给浏览器下载，请检查下载列表。';b.disabled=true;break}
case 'edit-table':editTable();break;
case 'save-table':{const f=new FormData($('#tableForm')),keys=dialogContext.tableKeys;let invalid=false;const table=(dialogContext.tableDraft||t.table).map((r,i)=>{const result={...r};for(const k of keys){const raw=String(f.get(i+'-'+k)).trim();result[k]=['name','period','unit'].includes(k)?raw:raw===''?null:Number(raw);if(typeof result[k]==='number'&&(!Number.isFinite(result[k])||result[k]<0))invalid=true}return result});if(invalid){notify('请输入非负有限数值，未知项留空');return}t.table=table;const a=clone(t.artifact);a.version=t.versions.length+1;a.table=clone(table);a.created=now();a.review=true;t.artifact=a;t.versions.push(clone(a));persist();closeDialog();render(false);break}

function prepareTourModule(){const n=tourState.step,main=$('#main');document.body.classList.add('tour-active');if(!tourState.graphSnapshot)tourState.graphSnapshot={...memoryGraph,transform:{...memoryGraph.transform}};if(n<3){const original=db.draft;try{if(n>0)db.draft={goal:SCENES[tourState.scene].example,scene:tourState.scene,mode:'task',depth:'research',example:true,scope:{web:true,sites:[],spaces:[],files:[]}};main.innerHTML=homeView()}finally{db.draft=original}if(n===1)TOUR_STEPS[1].target='.scene-card:nth-child('+(['industry','office','consumer'].indexOf(tourState.scene)+1)+')'}else if(n<6){const t=tutorialTask(),tab=['plan','run','result'][n-3];if(n===4){t.status='running';t.steps.forEach((x,i)=>x.status=i<2?'success':i===2?'running':'pending')}if(n===5){t.artifact=buildArtifact(t);t.table=t.artifact.table;t.status='completed'}main.innerHTML='<div class="tour-module-note">教程预览 · '+esc(SCENES[t.scene].name)+' · 不创建任务、不消耗额度</div>'+taskHeader(t,tab)+(n===3?planView(t):n===4?runView(t):resultView(t));}else{memoryGraph.demo=true;memoryGraph.query='';memoryGraph.space='';memoryGraph.types=new Set(Object.keys(GRAPH_TYPES));main.innerHTML=graphView();bindGraph();}main.scrollTop=0;main.querySelectorAll('input,textarea,select,button,a').forEach(el=>el.setAttribute('tabindex','-1'));main.onscroll=()=>{cancelAnimationFrame(tourPositionFrame);tourPositionFrame=requestAnimationFrame(positionTour)};}
function paintTour(){const step=TOUR_STEPS[tourState.step],d=ensureTour();prepareTourModule();d.innerHTML=`<div class="tour-shade" aria-hidden="true"></div><div class="tour-spotlight" aria-hidden="true"></div><section class="tour-panel" tabindex="-1"><div class="tour-top"><span class="tour-count">使用教程 · ${tourState.step+1} / ${TOUR_STEPS.length}</span><button class="btn small ghost" data-tour="skip">跳过教程</button></div><p class="tour-module-label">${step.module}</p><h2 id="tourTitle">${step.title}</h2><p id="tourText">${step.text}</p>${tourState.step===1?`<div class="tour-scene-options">${['industry','office','consumer'].map(k=>`<label><input type="radio" name="tourScene" value="${k}" ${tourState.scene===k?'checked':''}>${SCENES[k].name}</label>`).join('')}</div>`:''}<p class="tour-location">${innerWidth>1050?'← 左侧高亮区域':'↑ 上方高亮区域'} · ${tourState.step>=3?'教程预览':'当前模块'}</p><div class="tour-dots" aria-hidden="true">${TOUR_STEPS.map((_,i)=>`<i class="${i<=tourState.step?'on':''}"></i>`).join('')}</div><div class="tour-footer">${tourState.step?'<button class="btn small" data-tour="back">上一步</button>':'<span class="caption">可随时重看</span>'}${tourState.step===TOUR_STEPS.length-1?'<div class="row"><button class="btn small" data-tour="done">完成</button><button class="btn primary small" data-tour="start">体验所选场景</button></div>':'<button class="btn primary" data-tour="next">下一步</button>'}</div></section>`;positionTour();const target=$(step.target);target?.scrollIntoView({block:'center',behavior:'instant'});positionTour();d.querySelector('.tour-panel').focus({preventScroll:true});saveTourStatus('started');}
function positionTour(){const d=$('#welcomeTour');if(!d?.open)return;const panel=d.querySelector('.tour-panel'),spot=d.querySelector('.tour-spotlight'),shade=d.querySelector('.tour-shade');if(!panel)return;const w=innerWidth,h=innerHeight,wide=w>1050,main=$('#main');panel.style.left=wide?(w-372)+'px':'12px';panel.style.top=wide?'88px':'auto';panel.style.bottom=wide?'auto':'12px';document.body.style.setProperty('--tour-floor',wide?'20px':(panel.offsetHeight+28)+'px');const target=$(TOUR_STEPS[tourState.step].target),bounds=main.getBoundingClientRect();spot.hidden=true;shade.hidden=false;if(target){const r=target.getBoundingClientRect(),left=Math.max(bounds.left+3,r.left-6),right=Math.min(bounds.right-3,r.right+6),top=Math.max(bounds.top+3,r.top-6),bottom=Math.min(bounds.bottom-3,r.bottom+6);if(right>left&&bottom>top){spot.hidden=false;shade.hidden=true;Object.assign(spot.style,{left:left+'px',top:top+'px',width:(right-left)+'px',height:(bottom-top)+'px'});}}const hint=d.querySelector('.tour-location');if(hint)hint.textContent=(spot.hidden?'滚动预览区域以查看模块':wide?'← 左侧高亮区域':'↑ 上方高亮区域')+' · '+(tourState.step>=3?'教程预览':'当前模块');}
function endTour(status,restore=true){saveTourStatus(status);$('#welcomeTour')?.close();document.body.classList.remove('tour-active');document.body.style.removeProperty('--tour-floor');$('#main').onscroll=null;graphObserver?.disconnect();if(tourState.graphSnapshot)Object.assign(memoryGraph,tourState.graphSnapshot);if(restore&&tourState.returnPath!=='/')navigation(tourState.returnPath);render(false);if(restore)window.scrollTo(0,tourState.returnScroll);setTimeout(()=>{if(tourState.trigger?.isConnected)tourState.trigger.focus({preventScroll:true});else $('[data-action=tour-open]')?.focus({preventScroll:true})},120)}

window.addEventListener('resize',()=>{cancelAnimationFrame(tourPositionFrame);tourPositionFrame=requestAnimationFrame(positionTour)});window.addEventListener('scroll',()=>{if($('#welcomeTour')?.open){cancelAnimationFrame(tourPositionFrame);tourPositionFrame=requestAnimationFrame(positionTour)}},{passive:true});

const graphKnowledgeView=knowledgeView;knowledgeView=function(){return route[1]==='graph'?graphView():graphKnowledgeView()};
const graphKnowledgeNav=knowledgeNav;knowledgeNav=function(active){return graphKnowledgeNav(active).replace('</nav>',link('记忆图谱','/knowledge/graph',active==='graph'?'active':'')+'</nav>')};
const graphEnhanceView=enhanceView;enhanceView=function(){graphEnhanceView();if(!$('[data-side="graph"]')){const ref=$('[data-side="notes"]');ref?.insertAdjacentHTML('beforebegin',`<a class="nav-link" data-side="graph" href="#/knowledge/graph" title="记忆图谱"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="5" r="3"/><circle cx="18" cy="8" r="3"/><circle cx="10" cy="19" r="3"/><path d="m9 6 6 1M7 8l2 8m7-5-4 6"/></svg><span>记忆图谱</span></a>`)}if(route[1]==='graph'){$$('[data-side]').forEach(e=>{e.classList.toggle('active',e.dataset.side==='graph');e.removeAttribute('aria-current')});$('[data-side="graph"]').setAttribute('aria-current','page')}if(!$('.top-actions [data-action="tour-open"]'))$('.top-actions').insertAdjacentHTML('afterbegin',btn(icon('help')+'<span>使用教程</span>','tour-open','small ghost tour-replay','aria-label="重新查看使用教程"'));if(route[1]==='graph')bindGraph();else graphObserver?.disconnect();if(tourAutoPending&&!route.length){tourAutoPending=false;setTimeout(()=>{if(!route.length&&!$('#dialog').open)startTour();else tourAutoPending=true},350)}};
const graphEnhancedAction=enhancedAction;enhancedAction=async function(action,b){switch(action){case 'tour-open':startTour();return true;case 'graph-demo':memoryGraph.demo=!memoryGraph.demo;memoryGraph.selected=null;memoryGraph.query='';memoryGraph.types=new Set(Object.keys(GRAPH_TYPES));render(false);return true;case 'graph-zoom-in':graphZoom(1.5);return true;case 'graph-zoom-out':graphZoom(1/1.5);return true;case 'graph-fit':graphFit();return true;case 'graph-reset':{const r=$('#memoryCanvas').getBoundingClientRect();memoryGraph.transform={k:1,x:(r.width-1200)/2,y:(r.height-750)/2};graphTransform();return true}case 'graph-select':graphSelect(b.dataset.node,true);if($('#graphResults'))$('#graphResults').hidden=true;return true;case 'graph-evidence':{const node=memoryGraph.dataset.nodes.find(n=>n.id===memoryGraph.selected);if(!node?.source||!accessible(node.source)){notify('来源已不可用，请刷新图谱');return true}dialogContext={sources:memoryGraph.dataset.nodes.filter(n=>n.source).map(n=>n.source)};evidenceDialog(node.source.id);return true}case 'graph-link':graphLink(b.dataset.resource);return true;case 'graph-link-save':{const form=new FormData($('#graphLinkForm')),a=String(form.get('a')),target=String(form.get('b')),label=String(form.get('label')).trim();if(a===target||!label||label.length>40){$('#graphLinkError').textContent='请选择两份不同的知识，并填写 1–40 字关系说明。';return true}db.memoryLinks=db.memoryLinks||[];if(db.memoryLinks.some(l=>(l.a===a&&l.b===target||l.a===target&&l.b===a)&&l.label===label)){$('#graphLinkError').textContent='这条关系已经存在。';return true}if(![a,target].every(id=>db.resources.some(r=>r.id===id&&!r.deleted&&!r.excluded&&r.indexStatus==='ready'))){$('#graphLinkError').textContent='关联知识状态已变更，请重新选择。';return true}db.memoryLinks.push({id:uid('link'),a,b:target,label,created:now()});persist();closeDialog();memoryGraph.selected='r:'+a;render(false);notify('已保存手工关联');return true}case 'graph-unlink':{ask('移除这条手工关联',`<p>只移除关系，两份知识和原始引用保持不变。</p>`,()=>{db.memoryLinks=(db.memoryLinks||[]).filter(l=>l.id!==b.dataset.id);persist();closeDialog();render(false)},'移除关联');return true}}return graphEnhancedAction(action,b)};

render();if(recovered)notify('上次演示任务已保留检查点，可在任务记录中继续');

/* 首页场景卡：首次进入保持未选择，点击后才保留选中态。 */
window.__homeSceneChosen=false;
window.__homeSceneKey='';
const homeSceneObserver=new MutationObserver(()=>{
  const cards=[...document.querySelectorAll('#main .scene-card')];
  if(!cards.length)return;
  if(!window.__homeSceneChosen)cards.forEach(card=>card.classList.remove('selected'));
  else cards.forEach(card=>card.classList.toggle('selected',card.dataset.scene===window.__homeSceneKey));
});
homeSceneObserver.observe(document.body,{childList:true,subtree:true});
document.querySelectorAll('#main .scene-card').forEach(card=>card.classList.remove('selected'));
// 首页场景卡只切换场景上下文，不覆盖用户已经输入的问题；教程里的“体验场景”仍走 example。
document.addEventListener('click',event=>{
  const card=event.target.closest('#main .scene-card[data-action="example"]');
  if(card&&!document.body.classList.contains('tour-active'))card.dataset.action='scene-select';
},true);
document.addEventListener('click',event=>{
  const card=event.target.closest('#main .scene-card[data-scene]');
  if(!card)return;
  window.__homeSceneChosen=true;
  window.__homeSceneKey=card.dataset.scene;
  setTimeout(()=>document.querySelectorAll('#main .scene-card').forEach(item=>item.classList.toggle('selected',item.dataset.scene===window.__homeSceneKey)),0);
},true);
</script><style>

#main .scene-card:not(.selected):hover{
  border-color:#8aa8ff!important;
  box-shadow:0 0 0 3px #dce7ff,0 12px 28px #557cff26!important;
  transform:translateY(-2px);
}
#main .scene-card.selected{box-shadow:var(--glow-selected)!important}
